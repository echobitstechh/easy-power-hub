name: wahala_hq
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  dio: ^4.0.6
  pretty_dio_logger: ^1.1.1
  sembast: ^3.4.3+1
  path_provider: ^2.1.1
  intl: ^0.18.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  get_it: ^7.6.7
  flutter_svg: any
  update_available: ^3.0.0
  url_launcher: ^6.1.13
  flutter_native_splash: ^2.3.10
  lottie: any
  google_fonts: ^6.2.1

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  stacked_cli: ^1.3.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23 # android min sdk min:16, default 21



# The following section is specific to Flutter.
flutter:


  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
    - assets/videos/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  fonts:
    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/host_grotesk/HostGrotesk-Light.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Regular.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Medium.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-SemiBold.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Bold.ttf

    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Light.ttf
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf

    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Light.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Regular.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Medium.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-SemiBold.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Bold.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

