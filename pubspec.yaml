name: easy_ph
description: A new Flutter project.
publish_to: 'none'
# version: 7.0.0
version: 25.0.4+33


environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  stacked: ^3.5.0
  stacked_services: ^1.5.0
  dio: ^5.9.0
  intl_phone_field: ^3.2.0
  jwt_decoder: ^2.0.1
  pretty_dio_logger: ^1.4.0
  sembast: ^3.8.5+2
  path_provider: ^2.1.5
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  get_it: ^8.3.0
  flutter_svg: ^2.2.2
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  google_fonts: ^6.3.2
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  google_sign_in: ^6.2.2
  flutter_phone_direct_caller: ^2.2.1
  webview_flutter: ^4.13.0
  timeline_tile: ^2.0.0
  open_mail: ^1.2.1
  # uni_links: ^0.5.1
  # app_links: ^3.5.1
  app_links: ^6.4.1

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  firebase_in_app_messaging: ^0.9.0+4
  firebase_remote_config: ^6.1.2
  firebase_analytics: ^12.0.4
  package_info_plus: ^9.0.0
  pin_code_fields: ^8.0.1
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  share_plus: ^12.0.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  stacked_generator: ^1.6.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  stacked_cli: ^1.15.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/easy_ph_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21



# The following section is specific to Flutter.
flutter:


  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/gif/
    - assets/fonts/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  fonts:
    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/host_grotesk/HostGrotesk-Light.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Regular.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Medium.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-SemiBold.ttf
        - asset: assets/fonts/host_grotesk/HostGrotesk-Bold.ttf

    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Light.ttf
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf

    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Light.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Regular.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Medium.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-SemiBold.ttf
        - asset: assets/fonts/red_hat_display/RedHatDisplay-Bold.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/easy_ph_logo.png"
  color_dark: "#0d1117"
  image_dark: "assets/images/easy_ph_logo.png"

  android_12:
    image: "assets/images/easy_ph_logo.png"
    image_dark: "assets/images/easy_ph_logo.png"
    color: "#ffffff"
    color_dark: "#0d1117"
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#0d1117"

