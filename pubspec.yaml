  flutter:
    sdk: flutter

  flutter_svg: any
  cupertino_icons: ^1.0.2
  casa_vertical_stepper: ^0.0.5
  dio: ^4.0.6
  pretty_dio_logger: ^1.1.1
  sembast: ^3.4.3+1
  flutter_modular: ^5.0.3
  device_apps: ^2.1.1
  android_intent: ^2.0.0
  open_mail_app: ^0.4.5
  intl_phone_number_input: any
  webview_flutter: ^4.4.4
  intl_phone_field: ^3.0.0
  jwt_decoder: ^2.0.1
  video_player: ^2.2.14
  image_picker: ^0.8.7+5
  url_launcher: ^6.1.13
  flutter_rating_bar: ^4.0.1
#  intl: ^0.17.0
  flutter_image_compress: ^2.0.3
  lottie: any
  stacked: ^3.2.0
  stacked_services: ^1.0.0
  awesome_rating: ^0.0.4
  toggle_switch: ^2.1.0
  palette_generator: ^0.3.3+2
  share_plus: ^7.2.1
  pdf: ^3.10.6
  printing: ^5.6.0
  fluttertoast: ^8.0.8
  font_awesome_flutter: any
  path_provider: ^2.1.1
#  flutter_paystack: ^1.0.7
  flutterwave_standard: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_countdown_timer: ^4.1.0
  slidable_button: ^3.0.0+1
  cached_network_image: ^3.3.1
  marquee: ^2.2.3
  firebase_core: ^2.24.2
  update_available: ^3.0.0
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^16.3.2
  rxdart: ^0.27.7
  firebase_in_app_messaging: ^0.7.4+8
  firebase_analytics: ^10.8.0
  dotted_border: ^2.1.0
  workmanager: ^0.5.2
  pay: ^2.0.0
  showcaseview: ^3.0.0
  shimmer: ^3.0.0
  top_bottom_sheet_flutter: ^0.0.2
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  slide_countdown: ^1.1.0
  pin_code_fields: ^8.0.1
  animated_segmented_tab_control: ^2.0.0
  flutter_paystack: ^1.0.7
  flutter_staggered_grid_view: ^0.7.0
  flutter_gif: ^0.0.4





#  background_fetch: '^1.1.3'

dependency_overrides:
  http: ^0.13.5
  intl: ^0.18.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^2.0.1
  build_runner: ^2.2.0

  stacked_generator: ^1.0.0
  mockito: ^5.3.2
  change_app_package_name: ^1.1.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/easy_ph_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  fonts:
    - family: Panchang
      fonts:
        - asset: assets/fonts/Panchang-Bold.ttf
        - asset: assets/fonts/Panchang-Extrabold.ttf
        - asset: assets/fonts/Panchang-Extralight.ttf
        - asset: assets/fonts/Panchang-Light.ttf
        - asset: assets/fonts/Panchang-Medium.ttf
        - asset: assets/fonts/Panchang-Regular.ttf
        - asset: assets/fonts/Panchang-Semibold.ttf
        - asset: assets/fonts/Panchang-Variable.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf


        #    - family: Satoshi  # Add this section for Satoshi
#      fonts:
#        - asset: assets/fonts/satoshi/Satoshi-Variable.ttf  # Replace with your actual font file paths
#        - asset: assets/fonts/satoshi/Satoshi-VariableItalic.ttf
#          weight: 700
        # Add other font weights or styles for Satoshi as necessary




  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/easy_power_hub.gif
    - assets/animations/quality_power_supply.gif
    - assets/animations/easy_ph_1.gif
    - assets/animations/easy_ph_2.gif
    - assets/videos/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
